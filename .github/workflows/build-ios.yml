name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      display_name:
        description: "App display name on iPhone Home Screen"
        required: false
        default: "Cellular"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ios.yml"
      - "ios/**"

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build unsigned Release app
        working-directory: ios
        run: |
          xcodebuild \
            -project Tether.xcodeproj \
            -scheme Tether \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            TETHER_ENTITLEMENTS="" \
            TETHER_COMM_NOTIFICATIONS=NO \
            TETHER_DISPLAY_NAME="${{ inputs.display_name || 'Cellular' }}" \
            -skipMacroValidation \
            build

      - name: Package Tether.ipa
        run: |
          rm -rf dist Tether.ipa
          mkdir -p dist/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Tether.app dist/Payload/
          (cd dist && zip -qr ../Tether.ipa Payload)
          ls -lh Tether.ipa

      - name: Upload Tether.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tether-iOS-IPA
          path: Tether.ipa
          retention-days: 14
